[project]
name = "xunji-mcp"
version = "0.1.0"
description = "Personal MCP adapter for Xunji Open APIs"
requires-python = ">=3.14,<3.15"
dependencies = ["fastmcp==4.2.3", "httpx==0.28.1", "py-key-value-aio==0.5.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110

